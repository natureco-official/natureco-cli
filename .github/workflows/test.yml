name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.13.0'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22'
          - os: macos-15
            node: '22'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript and lint checks
        run: npm run lint

      - name: Unit and regression tests
        run: npm test -- --reporter=dot

      - name: CLI smoke test
        run: npm run smoke

      - name: Startup performance and provenance
        run: npm run perf:startup && npm run provenance:check

      - name: Dependency security audit
        run: npm run audit:deps

      - name: Verify publish package
        run: npm pack --dry-run
