version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    # Her paket için ayrı PR açmak yerine haftada tek PR: her PR iki iş akışı
    # (Tests + CodeQL) tetiklediği için ayrı ayrı açılan güncellemeler bakım
    # gürültüsünü katlıyordu. Büyük sürümler grup dışında kalır — onlar
    # kırılma ihtimali taşıdığı için tek tek incelenmeli.
    groups:
      gelistirme-bagimliliklari:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      uretim-bagimliliklari:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # commander 15+ is ESM-only; this project is CommonJS.
      # Revisit if/when the project migrates to ESM.
      - dependency-name: "commander"
        versions: [">=15"]
      # chalk 5+ is ESM-only; this project uses require('chalk') throughout.
      # Bumping it fails the whole suite (90 tests). Revisit with the ESM migration.
      - dependency-name: "chalk"
        versions: [">=5"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "automated"
    groups:
      is-akislari:
        patterns: ["*"]
